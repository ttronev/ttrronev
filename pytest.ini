[pytest]
# tests/        fast unit tests (synthetic data only — no candles, no network)
# service/      the service's own test_*.py (also runnable via `python -m`)
# NOT collected: paper_trade/test_streaming_parity*.py — those are long-running
# parity drills run by hand (see paper_trade/PARITY_RUNBOOK_WINDOWS.md).
testpaths = tests service
python_files = test_*.py
addopts = -q
