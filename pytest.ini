[pytest]
# tests/        fast unit tests (synthetic data only — no candles, no network),
#               mirrored by package: tests/detectors, tests/service, tests/shared,
#               tests/exchange; conftest.py and synth.py are shared at tests/
# service/      the service's own test_*.py (also runnable via `python -m`)
# NOT collected: archive/ (frozen; archive/paper_trade/test_streaming_parity*.py
# are long-running parity drills run by hand, see
# archive/paper_trade/PARITY_RUNBOOK_WINDOWS.md) and research/ (owner-run passes).
testpaths = tests service
python_files = test_*.py
addopts = -q --ignore=archive --ignore=research
