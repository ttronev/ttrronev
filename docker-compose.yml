# ttrronev-service — analysis worker + web API. No trading here.
#
# prod:  docker compose up -d
# dev:   docker compose -f docker-compose.yml -f docker-compose.override.dev.yml up

# Log rotation: without it the json-file driver grows until the disk is full
# (the worker logs every regen of every pair, every 5 minutes).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  worker:
    build: .
    command: python -m service.worker
    env_file:
      - path: .env
        required: false   # absent .env = no Telegram DMs, everything else works
    volumes:
      - ./data:/app/data
      - ./detectors/results:/app/detectors/results
    restart: unless-stopped
    # Hard ceiling so a runaway cycle is killed and restarted by Docker instead
    # of starving the host (the worker was once killed by the host instead).
    # 2g is deliberately generous: the 5m pass log prints the real peak RSS —
    # tighten this once it has been observed. Override: TTRRONEV_WORKER_MEM.
    mem_limit: ${TTRRONEV_WORKER_MEM:-2g}
    stop_grace_period: 30s
    logging: *default-logging
    # Healthy = the event loop stamped worker_heartbeat.json in the last 2 min.
    # The stamp starts before the startup regen, so a restart is healthy at once.
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,datetime as d; t=json.load(open('/app/detectors/results/worker_heartbeat.json'))['updated_at']; sys.exit(0 if (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t)).total_seconds()<120 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    build: .
    command: uvicorn service.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data:ro
      # rw since Stage 8: the API writes the pair registry (pairs.json);
      # everything else under results/ is still worker-owned.
      - ./detectors/results:/app/detectors/results
    ports:
      # Host port defaults to 8000 — the documented contract (README, service
      # runbook, deploy/Caddyfile.example). Override per machine WITHOUT editing
      # this file: put TTRRONEV_PORT=NNNN in .env (compose reads it) or the shell.
      - "127.0.0.1:${TTRRONEV_PORT:-8000}:8000"   # localhost only; Caddy proxies + auths outside
    depends_on: [worker]
    restart: unless-stopped
    mem_limit: ${TTRRONEV_API_MEM:-512m}
    logging: *default-logging
    # /api/pairs, not /api/health: this checks that the API itself answers.
    # /api/health also turns 503 when the WORKER's data is stale, which is not
    # an API fault (the external watchdog covers that — deploy/service_health_check.sh).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/pairs', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
