<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ttrronev — levels</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ttrronev <span class="brand-sub">structure monitor</span></div>
  <div class="topbar-right">
    <span id="health-dot" class="health-dot" role="status" title="worker health">● …</span>
    <select id="pair-select" aria-label="pair"></select>
  </div>
</header>

<main>
  <section class="hero">
    <div class="tile tile-price">
      <div class="tile-label">live price <span id="live-ok" class="live-ok"></span></div>
      <div class="tile-value" id="live-price">—</div>
      <div class="tile-foot" id="live-ts">waiting for data…</div>
    </div>
    <div class="tile">
      <div class="tile-label">trend 1D</div>
      <div class="tile-value trend" id="trend-1d">—</div>
      <div class="tile-foot" id="regime-1d">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">trend 4H</div>
      <div class="tile-value trend" id="trend-4h">—</div>
      <div class="tile-foot" id="regime-4h">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">last 1H close</div>
      <div class="tile-value" id="close-1h">—</div>
      <div class="tile-foot" id="generated-at">—</div>
    </div>
  </section>

  <section class="panel">
    <h2>Active ranges</h2>
    <div id="ranges"></div>
  </section>

  <div class="two-col">
    <section class="panel">
      <h2>Levels <span class="h2-sub">sorted by distance from live; ≤1.5% flagged</span></h2>
      <div class="table-wrap">
        <table id="levels-table">
          <thead>
            <tr><th>price</th><th>dist</th><th>TF</th><th>S/R</th><th>strength</th><th>last event</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Events <span class="h2-sub">last 24h, all TFs</span></h2>
      <ul id="events-feed" class="feed"></ul>
    </section>
  </div>
</main>

<footer class="foot">
  <span id="foot-status">—</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
